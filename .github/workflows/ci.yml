# CI — three independent checks, matching what `docs/14-testing.md` describes.
#
# NOTE: this workflow has never executed on a real runner. Treat the first run
# as part of the change, not as a formality.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web — typecheck · RTL guard · tests · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      # The single command the project verifies with locally.
      - run: npm run verify
        working-directory: web

  functions:
    name: functions — deno check · deno test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # Validates the vendor calls against the real installed SDK typings —
      # which is why this catches wrong API surface, not just wrong syntax.
      - run: deno check supabase/functions/*/index.ts
      # SB-010: the first Deno unit tests in the project — pure functions of
      # a Request and an env var, no DB or vendor needed. --allow-env only:
      # no network, no filesystem beyond what Deno itself needs.
      - run: deno test --allow-env supabase/functions/_shared/http.test.ts

  database:
    name: database — migrations + 12 schema assertions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned, not `latest`: resolving `latest` costs an unauthenticated
      # GitHub API call, and that call was rate-limited on the first real run
      # of this workflow. 2.109.1 is the version this project is developed
      # against locally.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Start the local stack
        # Only Postgres is needed to apply migrations and run assertions
        # against them; everything excluded here is start-up time this job
        # never uses.
        #
        # `inbucket` is excluded because it was the job's only source of
        # flakiness: it binds 54424 on the host, and twice on 2026-08-11 that
        # bind failed with `address already in use`, taking the whole stack
        # down during `supabase start`. Both times a plain re-run passed. The
        # job neither sends nor reads email, so the container has no reason to
        # exist here -- and one that is never created cannot fail to bind.
        #
        # That failure mode was worth removing rather than retrying: it happens
        # BEFORE any of the 12 assertions execute, so a red check said nothing
        # about the schema, and "probably the flake" is exactly the habit that
        # lets a real schema break through.
        #
        # `storage-api` was in this list and is NOT a name the CLI accepts --
        # its own set is analytics, db, edge-runtime, functions, imgproxy,
        # inbucket, kong, meta, realtime, rest, storage, studio, vector.
        # Unknown names are ignored rather than rejected (this step has always
        # passed), so storage has been starting all along. Corrected to
        # `storage`.
        run: >
          supabase start --exclude
          studio,realtime,storage,imgproxy,edge-runtime,functions,inbucket,vector,analytics

      - name: Apply migrations
        run: supabase db reset --no-seed

      # Every public table must have RLS enabled and cross-user reads must
      # return zero rows. A new table without a policy fails here.
      - name: Schema assertions
        run: |
          supabase db lint --level warning || true
          psql "$(supabase status -o json | jq -r '.DB_URL')" \
            -v ON_ERROR_STOP=1 -f supabase/tests/verify.sql

      - name: Stop
        # Runs even when an earlier step failed, so it must tolerate the stack
        # never having started -- otherwise a setup failure is reported twice,
        # the second time as a misleading `supabase: command not found`.
        if: always()
        run: supabase stop --no-backup || true
