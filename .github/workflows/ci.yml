# CI — three independent checks, matching what `docs/14-testing.md` describes.
#
# This workflow does run: every push to `main` and every PR since 2026-08-02,
# green on real runners. `main` is production (Cloudflare Pages auto-deploys
# the PWA from it), so a red check here is a blocked release, not a chore.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web — typecheck · RTL guard · tests · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      # docs/08-security.md's open item: the PWA's supply chain is its npm
      # tree, and every package in it runs on the origin with access to
      # localStorage. Gate on production deps only -- a dev-tool advisory
      # should not block a release, but one in shipped code must.
      - run: npm audit --omit=dev --audit-level=high
        working-directory: web
      # The single command the project verifies with locally.
      - run: npm run verify
        working-directory: web

  functions:
    name: functions — deno check · deno test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # Validates the vendor calls against the real installed SDK typings —
      # which is why this catches wrong API surface, not just wrong syntax.
      - run: deno check supabase/functions/*/index.ts
      # SB-010: the first Deno unit tests in the project — pure functions of
      # a Request and an env var, no DB or vendor needed. --allow-env only:
      # no network, no filesystem beyond what Deno itself needs.
      - run: deno test --allow-env supabase/functions/_shared/*.test.ts

  database:
    name: database — migrations + 31 schema assertions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned, not `latest`: resolving `latest` costs an unauthenticated
      # GitHub API call, and that call was rate-limited on the first real run
      # of this workflow. 2.109.1 is the version this project is developed
      # against locally.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Start the local stack
        # Only Postgres is needed to apply migrations and run assertions
        # against them; everything excluded here is start-up time this job
        # never uses.
        #
        # `mailpit` is the point of this list. It binds 54424 on the host, and
        # twice on 2026-08-11 that bind failed with `address already in use`,
        # taking the whole stack down during `supabase start`. Both times a
        # plain re-run passed. This job neither sends nor reads email, so the
        # container has no reason to exist here -- and one that is never
        # created cannot fail to bind.
        #
        # Worth removing rather than retrying: it failed BEFORE any of the
        # assertions ran, so a red check said nothing about the schema, and
        # "probably the flake" is the habit that lets a real break through.
        #
        # USE THE NAMES THE VALIDATOR ACCEPTS, NOT THE ONES IN `--help`.
        # `supabase start --help` advertises a DIFFERENT and partly wrong set
        # (it lists `inbucket`, `storage`, `functions`, `analytics`, none of
        # which are accepted). Unknown names are only WARNED about, not
        # rejected, so a typo here silently starts the container you meant to
        # skip -- which is exactly how a first attempt at this fix left Mailpit
        # running while appearing to have excluded it. The authoritative list
        # is printed by the warning itself:
        #
        #   edge-runtime, gotrue, imgproxy, kong, logflare, mailpit,
        #   postgres-meta, postgrest, realtime, storage-api, studio,
        #   supavisor, vector
        #
        # Anything added here must come from that list, and the run log must be
        # checked for "not valid to exclude" afterwards.
        run: >
          supabase start --exclude
          studio,realtime,storage-api,imgproxy,edge-runtime,mailpit,logflare,vector,supavisor

      - name: Apply migrations
        run: supabase db reset --no-seed

      # Every public table must have RLS enabled and cross-user reads must
      # return zero rows. A new table without a policy fails here.
      - name: Schema assertions
        run: |
          supabase db lint --level warning || true
          psql "$(supabase status -o json | jq -r '.DB_URL')" \
            -v ON_ERROR_STOP=1 -f supabase/tests/verify.sql

      - name: Stop
        # Runs even when an earlier step failed, so it must tolerate the stack
        # never having started -- otherwise a setup failure is reported twice,
        # the second time as a misleading `supabase: command not found`.
        if: always()
        run: supabase stop --no-backup || true
