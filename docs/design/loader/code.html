        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        /* Smooth, calm pulsing animation */

            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }

            animation: gentle-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;

<body class="bg-background text-on-background min-h-screen antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full bg-surface dark:bg-surface-container-low z-50 flex justify-between items-center h-16 px-container-padding-mobile">
<button aria-label="Menu" class="text-primary dark:text-primary-fixed-dim hover:bg-surface-container-high dark:hover:bg-surface-container-highest transition-colors duration-200 p-2 rounded-full">
<span class="material-symbols-outlined">menu</span>
</button>
<h1 class="font-headline-md text-headline-md-mobile font-semibold text-primary dark:text-primary-fixed-dim tracking-tight">
            Second Brain
        </h1>
<button aria-label="User profile avatar" class="w-8 h-8 rounded-full bg-surface-container-high dark:bg-surface-container-highest flex items-center justify-center text-primary dark:text-primary-fixed-dim hover:bg-surface-container-high dark:hover:bg-surface-container-highest transition-colors duration-200">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">account_circle</span>
</button>
</header>
<!-- Main Canvas (Loading State) -->
<main class="pt-24 pb-28 px-container-padding-mobile max-w-lg mx-auto w-full flex flex-col gap-stack-gap">
<!-- Top Level Loading Indicator -->
<div class="flex flex-col items-center justify-center py-8 gap-4 mb-4">
<div class="relative w-16 h-16 flex items-center justify-center">
<!-- Outer glowing ring -->
<div class="absolute inset-0 rounded-full border-2 border-secondary-fixed opacity-20"></div>
<!-- Pulsing inner circle -->
<div class="w-8 h-8 rounded-full bg-primary-container animate-gentle-pulse"></div>
</div>
<p class="font-body-md text-body-md text-on-surface-variant animate-pulse" dir="rtl">جاري تجهيز المساحة...</p>
</div>
<!-- Skeleton Form Layout -->
<div class="bg-surface-container-lowest border border-surface-variant rounded-xl p-6 flex flex-col gap-6 shadow-[0px_4px_20px_rgba(51,65,85,0.02)]">
<!-- Skeleton Input Field -->
<div class="flex flex-col gap-2">
<div class="h-4 w-24 bg-surface-container-high rounded animate-gentle-pulse"></div>
<div class="h-12 w-full bg-surface-container-low rounded-lg border border-surface-variant animate-gentle-pulse"></div>
</div>
<!-- Skeleton Textarea -->
<div class="flex flex-col gap-2">
<div class="h-4 w-32 bg-surface-container-high rounded animate-gentle-pulse"></div>
<div class="h-32 w-full bg-surface-container-low rounded-lg border border-surface-variant animate-gentle-pulse"></div>
</div>
<!-- Skeleton Chips/Tags -->
<div class="flex flex-col gap-2">
<div class="h-4 w-16 bg-surface-container-high rounded animate-gentle-pulse"></div>
<div class="flex gap-2 flex-wrap">
<div class="h-8 w-20 bg-surface-container-highest rounded-full animate-gentle-pulse"></div>
<div class="h-8 w-24 bg-surface-container-highest rounded-full animate-gentle-pulse"></div>
<div class="h-8 w-16 bg-surface-container-highest rounded-full animate-gentle-pulse"></div>
</div>
</div>
<!-- Skeleton Button -->
<div class="mt-4 h-12 w-full bg-primary-container/40 rounded-lg animate-gentle-pulse"></div>
</div>
</main>

<nav class="fixed bottom-0 left-0 w-full h-20 z-50 flex justify-around items-center px-4 pb-safe bg-surface dark:bg-surface-container-low rounded-t-xl shadow-[0_-4px_20px_rgba(51,65,85,0.03)]" style="border-top: none;">
<!-- Ideas (Inactive) -->
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant p-2 hover:bg-surface-container-highest transition-colors duration-200">
<span class="material-symbols-outlined mb-1">lightbulb</span>

</button>

<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant p-2 hover:bg-surface-container-highest transition-colors duration-200">

<span class="font-label-md text-label-md">Tasks</span>
</button>

<span class="font-label-md text-label-md">Notes</span>
</button>

<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">add_circle</span>
<span class="font-label-md text-label-md">Capture</span>
</button>
