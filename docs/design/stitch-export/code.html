<script>
        // Simple micro-interaction for the record button
        const recordBtn = document.querySelector('.pulse-effect');
        const mainIcon = recordBtn.querySelector('.material-symbols-outlined');
        const labelText = recordBtn.querySelector('span:last-child');
        let isRecording = false;

        recordBtn.addEventListener('click', () => {
            isRecording = !isRecording;
            if (isRecording) {
                recordBtn.style.backgroundColor = '#ba1a1a'; // error
                recordBtn.style.borderColor = '#ffdad6'; // error-container
                recordBtn.classList.remove('pulse-effect'); // Stop standard pulse for high-focus recording state
                mainIcon.textContent = 'stop_circle';
                labelText.textContent = 'جاري التسجيل...';
                labelText.classList.add('animate-pulse');
            } else {
                recordBtn.style.backgroundColor = '#1b3022'; // primary-container
                recordBtn.style.borderColor = '#b4cdb8'; // primary-fixed-dim
                recordBtn.classList.add('pulse-effect');
                mainIcon.textContent = 'add_circle';
                labelText.textContent = 'اسجل / اكتب';
                labelText.classList.remove('animate-pulse');
            }
        });
    </script>
