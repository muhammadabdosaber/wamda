<!--
  Sign-in email.

  This template exists because the app asks for a SIX-DIGIT CODE, and
  Supabase's default magic-link template contains only {{ .ConfirmationURL }}.
  Without {{ .Token }} here, users would receive a link they cannot type into
  the code field — the sign-in screen would be unusable in production even
  though the client code is correct.

  Arabic-first, and RTL at the document level: an email is the first thing a
  new user sees, and a left-aligned Arabic email reads as a broken one. Styles
  are inline because email clients strip <style> blocks.
-->
<div dir="rtl" lang="ar" style="font-family: 'Segoe UI', Tahoma, Arial, sans-serif; line-height: 1.8; color: #1f2421; max-width: 480px; margin: 0 auto; padding: 24px;">
  <h2 style="margin: 0 0 16px; font-size: 20px;">الدماغ الثاني</h2>

  <p style="margin: 0 0 20px;">رمز تسجيل الدخول الخاص بك:</p>

  <p style="margin: 0 0 24px; font-family: monospace; font-size: 32px; letter-spacing: 8px; text-align: center; background: #e6efe9; color: #3e6b5c; padding: 16px; border-radius: 12px;" dir="ltr">{{ .Token }}</p>

  <p style="margin: 0 0 8px; color: #6b7280; font-size: 14px;">
    الرمز صالح لمدة ساعة واحدة. إذا لم تطلب تسجيل الدخول، تجاهل هذه الرسالة.
  </p>

  <p style="margin: 24px 0 0; color: #6b7280; font-size: 13px;">
    أو
    <a href="{{ .ConfirmationURL }}" style="color: #3e6b5c;">اضغط هنا لتسجيل الدخول مباشرة</a>.
  </p>
</div>
