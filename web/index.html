<!doctype html>
<!--
  lang and dir are Arabic-first in the served HTML, not applied by JavaScript
  after hydration.

  If the document started as `dir="ltr"` and React flipped it on mount, every
  first paint would render left-to-right and then visibly jump. On a slow
  connection that flash is the first thing the user sees. Setting it here means
  the very first frame is already correct; `applyDirection()` only changes it
  if the user later picks a different language.
-->
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#334155" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />

    <!--
      Fonts are SELF-HOSTED, not loaded from a CDN. The @font-face blocks in
      global.css point at /fonts/*.woff2 (Public Sans + Noto Sans Arabic),
      which the service worker precaches. A Google Fonts <link> here used to
      pull IBM Plex Sans Arabic over the network -- a dependency that fails the
      instant the user is offline, which is exactly the case this PWA is built
      for. Removed on purpose; do not re-add a CDN font.

      The one woff2 that matters for first paint is preloaded so Arabic text
      does not flash in a fallback face before the real one arrives.
    -->
    <link
      rel="preload"
      href="/fonts/noto-sans-arabic.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <title>ومضة</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
